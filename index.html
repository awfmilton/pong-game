<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pong</title>
  <style>
    body {
      background: #0d0f17;
      color: #e6e6e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    }
    canvas#pong {
      background: #05060b;
      border: 2px solid #1b2233;
      border-radius: 6px;
      image-rendering: pixelated;
      box-shadow: 0 0 40px rgba(0,243,255,0.12);
      max-width: 100%;
    }
    .hud {
      margin-top: 14px;
      font-size: 13px;
      color: #7a8699;
      letter-spacing: 1px;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="pong" width="800" height="500"></canvas>
  <div class="hud">
    W / S — LEFT PADDLE, ↑ / ↓ — RIGHT PADDLE, SPACE — PAUSE, ENTER — START / RESTART, FIRST TO 7 WINS
  </div>
  <script></script>
</body>
</html>
