<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pong</title>
  <style>
    body {
      background: #0d0f17;
      color: #e6e6e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    }
    canvas#pong {
      background: #05060b;
      border: 2px solid #1b2233;
      border-radius: 6px;
      image-rendering: pixelated;
      box-shadow: 0 0 40px rgba(0,243,255,0.12);
      max-width: 100%;
    }
    .hud {
      margin-top: 14px;
      font-size: 13px;
      color: #7a8699;
      letter-spacing: 1px;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="pong" width="800" height="500"></canvas>
  <div class="hud">
    W / S — LEFT PADDLE, ↑ / ↓ — RIGHT PADDLE, SPACE — PAUSE, ENTER — START / RESTART, FIRST TO 7 WINS
  </div>
  <script>
    const canvas = document.getElementById('pong');
    const ctx = canvas.getContext('2d');

    // Constants
    const WIDTH = 800;
    const HEIGHT = 500;
    const WINNING_SCORE = 7;
    const PADDLE_W = 12;
    const PADDLE_H = 90;
    const PADDLE_SPEED = 7;
    const PADDLE_MARGIN = 20;
    const BALL_R = 7;
    const BALL_SPEED = 6;
    const MAX_BOUNCE_ANGLE = Math.PI / 4;
    const SPEED_STEP = 0.35;
    const MAX_BALL_SPEED = 14;

    // Game state objects
    const gameState = {
      status: 'MENU',
      winner: null
    };

    const left = {
      x: PADDLE_MARGIN,
      y: (HEIGHT - PADDLE_H) / 2,
      score: 0,
      up: false,
      down: false
    };

    const right = {
      x: WIDTH - PADDLE_MARGIN - PADDLE_W,
      y: (HEIGHT - PADDLE_H) / 2,
      score: 0,
      up: false,
      down: false
    };

    const ball = {
      x: WIDTH / 2,
      y: HEIGHT / 2,
      dx: 0,
      dy: 0,
      speed: BALL_SPEED
    };

    // Helper functions
    function resetBall(dir) {
      ball.x = WIDTH / 2;
      ball.y = HEIGHT / 2;
      ball.speed = BALL_SPEED;
      const angle = (Math.random() * 2 - 1) * MAX_BOUNCE_ANGLE;
      ball.dx = dir * ball.speed * Math.cos(angle);
      ball.dy = ball.speed * Math.sin(angle);
    }

    function resetGame() {
      left.score = 0;
      right.score = 0;
      left.y = (HEIGHT - PADDLE_H) / 2;
      right.y = (HEIGHT - PADDLE_H) / 2;
      resetBall(Math.random() < 0.5 ? 1 : -1);
      gameState.status = 'PLAYING';
      gameState.winner = null;
    }

    // Call once on load
    resetBall(1);

    // Keyboard input layer (issue #3)
    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault();
      switch (e.key) {
        case 'w': case 'W': left.up = true; break;
        case 's': case 'S': left.down = true; break;
        case 'ArrowUp': right.up = true; break;
        case 'ArrowDown': right.down = true; break;
        case ' ':
          if (gameState.status === 'PLAYING') gameState.status = 'PAUSED';
          else if (gameState.status === 'PAUSED') gameState.status = 'PLAYING';
          break;
        case 'Enter':
          if (gameState.status === 'MENU' || gameState.status === 'GAME_OVER') resetGame();
          break;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.repeat) return;
      switch (e.key) {
        case 'w': case 'W': left.up = false; break;
        case 's': case 'S': left.down = false; break;
        case 'ArrowUp': right.up = false; break;
        case 'ArrowDown': right.down = false; break;
      }
    });

    // update() — physics simulation step (issue #5)
    function update() {
      if (gameState.status !== 'PLAYING') return;

      if (left.up && left.y > 0) left.y -= PADDLE_SPEED;
      if (left.down && left.y + PADDLE_H < HEIGHT) left.y += PADDLE_SPEED;
      if (right.up && right.y > 0) right.y -= PADDLE_SPEED;
      if (right.down && right.y + PADDLE_H < HEIGHT) right.y += PADDLE_SPEED;

      ball.x += ball.dx;
      ball.y += ball.dy;

      if (ball.y - BALL_R <= 0) { ball.y = BALL_R; ball.dy = Math.abs(ball.dy); }
      if (ball.y + BALL_R >= HEIGHT) { ball.y = HEIGHT - BALL_R; ball.dy = -Math.abs(ball.dy); }

      if (ball.dx < 0 && ball.x - BALL_R <= left.x + PADDLE_W && ball.x - BALL_R > left.x &&
          ball.y + BALL_R >= left.y && ball.y - BALL_R <= left.y + PADDLE_H) {
        const rel = (ball.y - (left.y + PADDLE_H / 2)) / (PADDLE_H / 2);
        const angle = rel * MAX_BOUNCE_ANGLE;
        ball.speed = Math.min(ball.speed + SPEED_STEP, MAX_BALL_SPEED);
        ball.dx = ball.speed * Math.cos(angle);
        ball.dy = ball.speed * Math.sin(angle);
        ball.x = left.x + PADDLE_W + BALL_R;
      }

      if (ball.dx > 0 && ball.x + BALL_R >= right.x && ball.x + BALL_R < right.x + PADDLE_W &&
          ball.y + BALL_R >= right.y && ball.y - BALL_R <= right.y + PADDLE_H) {
        const rel = (ball.y - (right.y + PADDLE_H / 2)) / (PADDLE_H / 2);
        const angle = rel * MAX_BOUNCE_ANGLE;
        ball.speed = Math.min(ball.speed + SPEED_STEP, MAX_BALL_SPEED);
        ball.dx = -ball.speed * Math.cos(angle);
        ball.dy = ball.speed * Math.sin(angle);
        ball.x = right.x - BALL_R;
      }

      if (ball.x - BALL_R < 0) {
        right.score++;
        if (right.score >= WINNING_SCORE) { gameState.status = 'GAME_OVER'; gameState.winner = 'RIGHT'; }
        else resetBall(1);
      }
      if (ball.x + BALL_R > WIDTH) {
        left.score++;
        if (left.score >= WINNING_SCORE) { gameState.status = 'GAME_OVER'; gameState.winner = 'LEFT'; }
        else resetBall(-1);
      }
    }

    // render() — canvas draw pass (issue #6)
    function render() {
      ctx.fillStyle = '#05060b';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.setLineDash([10, 15]);
      ctx.strokeStyle = '#1b2233';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(WIDTH / 2, 0);
      ctx.lineTo(WIDTH / 2, HEIGHT);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#e6e6e6';
      ctx.fillRect(left.x, left.y, PADDLE_W, PADDLE_H);
      ctx.fillRect(right.x, right.y, PADDLE_W, PADDLE_H);

      ctx.fillStyle = '#00f3ff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#e6e6e6';
      ctx.font = '900 48px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(left.score, WIDTH / 4, 60);
      ctx.fillText(right.score, (3 * WIDTH) / 4, 60);

      if (gameState.status === 'MENU') {
        ctx.fillStyle = 'rgba(13,15,23,0.75)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = '#e6e6e6';
        ctx.font = '700 32px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('PONG', WIDTH / 2, HEIGHT / 2 - 20);
        ctx.font = '400 16px ui-monospace, monospace';
        ctx.fillStyle = '#7a8699';
        ctx.fillText('Press ENTER to start', WIDTH / 2, HEIGHT / 2 + 20);
      } else if (gameState.status === 'PAUSED') {
        ctx.fillStyle = 'rgba(13,15,23,0.6)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = '#e6e6e6';
        ctx.font = '700 28px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', WIDTH / 2, HEIGHT / 2);
      } else if (gameState.status === 'GAME_OVER') {
        ctx.fillStyle = 'rgba(13,15,23,0.75)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = '#e6e6e6';
        ctx.font = '700 32px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(gameState.winner === 'LEFT' ? 'LEFT WINS!' : 'RIGHT WINS!', WIDTH / 2, HEIGHT / 2 - 20);
        ctx.font = '400 16px ui-monospace, monospace';
        ctx.fillStyle = '#7a8699';
        ctx.fillText('Press ENTER to restart', WIDTH / 2, HEIGHT / 2 + 20);
      }
    }

    // requestAnimationFrame game loop (issue #4)
    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
